              }
            },
            {
              "name": "month",
              "label": "月",
              "type": "select",
              "required": true,
              "options": {
                "values": [
                  "1月",
                  "2月",
                  "3月",
                  "4月",
                  "5月",
                  "6月",
                  "7月",
                  "8月",
                  "9月",
                  "10月",
                  "11月",
                  "12月"

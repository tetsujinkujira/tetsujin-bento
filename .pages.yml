        {
          "name": "news",
          "label": "お知らせ",
          "type": "object",
          "fields": [
            {
              "name": "title",
              "label": "タイトル",
              "type": "string",
              "required": true
            },
            {
              "name": "date",
              "label": "掲載日",
              "type": "date",
              "required": true,
              "options": {
                "format": "yyyy-MM-dd",
                "time": false
